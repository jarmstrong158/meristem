name: tests

# The repo had no CI at all: every guard in it — the asset gate, the cross-reference
# layer, the schema/registry drift test — only ran if someone remembered to run it.
# This runs the whole suite on every push and PR, on both the OS the project is
# developed on (Windows) and the one it is most likely to be consumed on (Linux),
# because the pipeline touches paths, image bytes, and generated Godot projects.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The packages are not installed: each package's conftest.py puts its own and
      # its siblings' source dirs on sys.path, so the suite runs from a checkout.
      # Only the third-party runtime deps are needed. `mcp` is included on purpose —
      # without it the MCP server tests would silently skip, and a skipped check is
      # not a passed check (dec-0036).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7" "Pillow>=10" "numpy>=1.24" "jsonschema>=4.20" "mcp>=1.0"

      - name: Run the suite
        run: python -m pytest -q -rs

      # The Godot engine smoke tests opt in via MERISTEM_GODOT and are not installed
      # here; make it visible in the log that they did not run, rather than letting a
      # green check imply the compiled project was launched.
      - name: Note the checks this job did not run
        if: always()
        shell: bash
        run: |
          echo "NOT RUN in CI: Godot engine smoke tests (compile -> --import -> run)"
          echo "and the visual capture loop. They require a Godot 4.x binary via"
          echo "MERISTEM_GODOT and are reported as skips above."
