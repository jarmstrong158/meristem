[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meristem-spec-store"
version = "0.1.0"
description = "Versioned, schema-enforced project manifest with an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# meristem-generators is NOT optional: cross-reference validation resolves every
# entity/item sprite descriptor and every level legend tile against the live
# generator catalog. Without it those checks cannot run, and a validation report
# that silently skips checks is worse than one that fails.
#
# meristem-asset-gate is likewise required, for the same reason it is required by the
# compiler: the style contract lives IN the manifest, and turning that domain into a
# usable contract (StyleContract.from_dict) is what lets preview_sprite render against
# the same contract the build will use, and report the gate verdict beside the picture.
dependencies = ["jsonschema>=4.20", "meristem-generators", "meristem-asset-gate"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "mcp>=1.0"]

[project.scripts]
meristem-spec-store = "meristem_spec_store.server:main"

[tool.setuptools]
packages = ["meristem_spec_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
